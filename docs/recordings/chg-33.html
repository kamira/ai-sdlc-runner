const STEPS = [{"title": "the five example scenarios, driven end to end", "command": "python3 examples/tide-spa/scenarios.py", "note": "each is plan.json plus one named mutation", "exit": 0, "real": 9.4, "start": 2.0, "end": 5.837, "waited": null, "pauses": [[0.0, 3.7], [3.247, 3.8]], "events": [[2.0, "\r\n────────────────────────────────────────────────────────────────────────────────────────────\r\nA · the flow as written\r\n────────────────────────────────────────────────────────────────────────────────────────────"], [2.0, "\r\nexit 0 · 25 asks · built ['app.js', 'index.html', 'styles.css', 'tides.js']\r\nlast line: continue with: --resume --confirm merge  (run C:\\Users\\haruharu\\AppData\\Local\\Temp\\tide-r8qj9y2w\\asks)\r\n"], [3.247, "\r\n────────────────────────────────────────────────────────────────────────────────────────────\r\nB · a deploy inside the build\r\n────────────────────────────────────────────────────────────────────────────────────────────"], [3.247, "\r\n"], [3.247, "exit 0 · 7 asks · built nothing"], [3.247, "\r\n"], [3.247, "last line: state:         stopped"], [3.247, "\r\n"], [5.247, "\r\n────────────────────────────────────────────────────────────────────────────────────────────\r\nC · a spec with nothing in it\r\n────────────────────────────────────────────────────────────────────────────────────────────"], [5.247, "\r\nexit 0 · 25 asks · built ['app.js', 'index.html', 'styles.css', 'tides.js']\r\nlast line: continue with: --resume --confirm merge  (run C:\\Users\\haruharu\\AppData\\Local\\Temp\\tide-j1vinazi\\asks)\r\n"], [5.529, "\r\n────────────────────────────────────────────────────────────────────────────────────────────\r\nD · operations, misspelled\r\n────────────────────────────────────────────────────────────────────────────────────────────"], [5.529, "\r\nexit 2 · 0 asks · built nothing\r\nlast line: error: C:\\Users\\haruharu\\AppData\\Local\\Temp\\tide-4gjm8lgq\\plan.json sets ['operationz'], which this runner does not read. Ignoring them would let a setting look configured and do nothing — and the cas\r\n"], [5.837, "\r\n────────────────────────────────────────────────────────────────────────────────────────────\r\nE · an acceptance with no task\r\n────────────────────────────────────────────────────────────────────────────────────────────"], [5.837, "\r\nexit 2 · 0 asks · built nothing\r\nlast line: error: C:\\Users\\haruharu\\AppData\\Local\\Temp\\tide-1umv2_lj\\plan.json's `ship` sets ['acc_body', 'acc_id'] and no `task`. The acceptance effect runs only when a task is named, so those would be read by \r\n\r\n════════════════════════════════════════════════════════════════════════════════════════════\r\nsummary\r\n════════════════════════════════════════════════════════════════════════════════════════════\r\n  A · the flow as written            exit 0  25 asks  4 files\r\n  B · a deploy inside the build      exit 0   7 asks  0 files\r\n  C · a spec with nothing in it      exit 0  25 asks  4 files\r\n  D · operations, misspelled         exit 2   0 asks  0 files\r\n  E · an acceptance with no task     exit 2   0 asks  0 files\r\n"]]}, {"title": "the recorder and the player", "command": "python3 -m pytest tests/test_recording.py -q -p no:randomly", "note": "13 tests: real subprocesses, real timings", "exit": 0, "real": 3.1, "start": 7.447, "end": 8.821, "waited": null, "pauses": [], "events": [[7.447, "."], [7.934, "."], [8.014, "."], [8.126, "."], [8.326, "."], [8.429, "."], [8.445, "."], [8.451, "."], [8.451, "."], [8.46, "."], [8.46, "."], [8.573, "."], [8.743, "."], [8.743, "                                                            [100%]"], [8.82, "\r\n"], [8.821, "13 passed in 2.26s"], [8.821, "\r\n"]]}, {"title": "the conversation store, including the new playback format", "command": "python3 -m pytest tests/test_conversations.py -q -p no:randomly", "note": "", "exit": 0, "real": 6.7, "start": 9.619, "end": 15.018, "waited": null, "pauses": [[13.018, 2.4]], "events": [[9.619, "."], [9.681, "."], [9.735, "."], [9.785, "."], [9.821, "."], [9.859, "."], [9.892, "."], [9.924, "."], [11.376, "."], [11.417, "."], [11.422, "."], [11.424, "."], [11.426, "."], [11.427, "."], [11.429, "."], [11.43, "."], [11.43, "."], [11.432, "."], [11.433, "."], [11.438, "."], [11.441, "."], [11.441, "."], [11.443, "."], [11.444, "."], [11.445, "."], [11.446, "."], [11.447, "."], [11.451, "."], [11.453, "."], [11.454, "."], [11.456, "."], [11.461, "."], [11.462, "."], [11.471, "."], [11.547, "."], [11.579, "."], [11.613, "."], [11.678, "."], [11.704, "."], [11.753, "."], [11.802, "."], [11.861, "."], [11.916, "."], [11.971, "."], [12.004, "."], [12.066, "."], [12.115, "."], [12.119, "."], [12.12, "."], [12.146, "."], [12.182, "."], [12.209, "."], [12.236, "."], [12.242, "."], [12.272, "."], [12.273, "."], [12.275, "."], [12.337, "."], [12.447, "."], [12.49, "."], [12.557, "."], [12.62, "."], [12.647, "."], [12.649, "."], [12.652, "."], [12.66, "."], [12.664, "."], [12.708, "."], [12.735, "."], [12.769, "."], [12.77, "."], [13.018, "."], [13.018, " [ 98%]\r\n"], [13.018, "."], [13.018, "                                                                        [100%]"], [15.018, "\r\n"], [15.018, "73 passed in 5.86s"], [15.018, "\r\n"]]}, {"title": "long paths", "command": "python3 -m pytest tests/test_paths.py -q -p no:randomly", "note": "", "exit": 0, "real": 0.9, "start": 15.768, "end": 15.881, "waited": null, "pauses": [], "events": [[15.768, "."], [15.774, "."], [15.812, "."], [15.823, "."], [15.826, "."], [15.829, "."], [15.831, "."], [15.836, "."], [15.837, "."], [15.838, "s"], [15.839, "."], [15.84, "."], [15.847, "."], [15.854, "."], [15.856, "."], [15.859, "."], [15.869, "."], [15.87, "                                                        [100%]"], [15.88, "\r\n"], [15.881, "16 passed, 1 skipped in 0.20s"], [15.881, "\r\n"]]}];
const TOTAL = parseFloat("15.9");
const out = document.getElementById('out'), list = document.getElementById('steps');
const scrub = document.getElementById('scrub'), playBtn = document.getElementById('play');
const timeLabel = document.getElementById('time'), speed = document.getElementById('speed');
const term = document.getElementById('term');
let clock = 0, playing = false, last = null, current = -1;

STEPS.forEach((s, i) => {
  const li = document.createElement('li');
  if (s.exit !== 0 && s.exit !== null) li.className = 'bad';
  const b = document.createElement('button');
  b.innerHTML = '<span class="st"><span class="n">' + String(i).padStart(2, '0') + '</span>' +
    '<span>' + s.real + 's</span>' + (s.exit ? '<span class="c1">exit ' + s.exit + '</span>' : '') +
    '</span><span class="sl">' + s.title.replace(/[&<>]/g, c =>
      ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</span>';
  b.onclick = () => { seek(s.start); };
  li.appendChild(b); list.appendChild(li);
});

function stepAt(t) {
  let n = 0;
  for (let i = 0; i < STEPS.length; i++) if (STEPS[i].start <= t) n = i;
  return n;
}

function draw() {
  const n = stepAt(clock), s = STEPS[n];
  const html = [];
  if (s.waited) html.push('<span class="pause">-- ' + fmt(s.waited) + ' between steps --</span>\n');
  html.push('<span class="cmd">' + s.command.replace(/[&<>]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</span>\n');
  if (s.note) html.push('<span class="pause">' + s.note + '</span>\n');
  let pauseIdx = 0;
  for (const [at, data] of s.events) {
    if (at > clock) break;
    while (pauseIdx < s.pauses.length && s.pauses[pauseIdx][0] <= at) {
      html.push('<span class="pause">-- waited ' + fmt(s.pauses[pauseIdx][1]) + ' --</span>\n');
      pauseIdx++;
    }
    html.push(data);
  }
  if (n !== current) {
    current = n;
    [...list.children].forEach((li, i) => li.classList.toggle('on', i === n));
    list.children[n].scrollIntoView({block: 'nearest'});
  }
  out.innerHTML = html.join('');
  term.scrollTop = term.scrollHeight;
  timeLabel.textContent = clock.toFixed(1) + ' / ' + TOTAL + 's';
  scrub.value = clock;
}

function fmt(sec) {
  return sec >= 60 ? (sec / 60).toFixed(1) + ' min' : Math.round(sec) + 's';
}

function seek(t) { clock = Math.max(0, Math.min(TOTAL, t)); current = -1; draw(); }

function tick(now) {
  if (!playing) return;
  if (last !== null) clock += ((now - last) / 1000) * parseFloat(speed.value);
  last = now;
  if (clock >= TOTAL) { clock = TOTAL; stop(); }
  draw();
  if (playing) requestAnimationFrame(tick);
}

function stop() { playing = false; last = null; playBtn.textContent = 'Play'; }

playBtn.onclick = () => {
  if (playing) { stop(); return; }
  if (clock >= TOTAL) clock = 0;
  playing = true; playBtn.textContent = 'Pause'; last = null;
  requestAnimationFrame(tick);
};
scrub.oninput = () => { stop(); seek(parseFloat(scrub.value)); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === ' ') { e.preventDefault(); playBtn.click(); }
  if (e.key === 'ArrowRight') { stop(); seek(clock + 5); }
  if (e.key === 'ArrowLeft') { stop(); seek(clock - 5); }
});
draw();
</script>
