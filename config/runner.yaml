# ai-sdlc-runner configuration
#
# This runner holds its own governance (src/ai_sdlc_runner/policy.py) and drives its own flow
# (graph.py). Nothing here points at a skill: there is none to point at. What lives here is what
# genuinely varies between machines and runs.

# How an ask is dispatched. Omit it and asks are answered by a stub, which is what makes a dry run
# free. Given a command, the runner starts ONE PROCESS PER ASK and writes the work order to its
# stdin — the session boundary made physical, so "closed after the ask" is not a promise the backend
# has to keep.
# agent_command: ["claude", "-p"]

# Seconds ONE ATTEMPT at one ask may run before its process is killed. A ceiling for a backend that
# has hung, not an estimate: an engineer building a module routinely runs longer than ten minutes.
# When it fires, the direct child is killed (anything it started may keep running), what it wrote
# so far stays, a retry (agent_retries) starts on top of it, and with no retry left the run stops
# with the question pending. The worst case for one ask is agent_timeout x (agent_retries + 1).
agent_timeout: 3600

# Per-seat routing lives in the plan file, not here, because which model answers which seat is a
# property of a change rather than of a machine. See `seat_models` in the plan.
