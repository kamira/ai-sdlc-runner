# CI for ai-sdlc-runner (CHG-20260817-10).
#
# The matrix is the point. The five failures fixed in CHG-20260817-09 were Windows-only and survived
# four prior CHGs unnoticed; a single-OS pipeline would have been green throughout and caught none of
# them. Both operating systems, and the declared `requires-python` floor as well as current Python.
#
# Deliberately NOT gated on a coverage percentage: measuring the CHG-20260817-09 fix showed
# executors.py at 86% before and 85% after — the broken tests had been executing the code and dying
# inside it, so coverage counted the lines while no assertion ever ran. A threshold would have
# reported that module as well-tested throughout the period it was entirely broken, and would have
# blocked the fix for lowering the number.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One red cell must never hide the state of the other three.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.13"]
    env:
      # The governance tables and work orders are UTF-8; without these, Windows raises a
      # false-positive encoding error that looks like a real failure.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      # No `submodules:` key needed — there are none, and nothing is fetched at build time. The
      # flow and the governance are both in this checkout, in source (CHG-20260823-01).
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      # -rs prints skip reasons, so a test that quietly stops running stays visible in the log.
      - name: Test
        run: python -m pytest tests/ -q -rs

  doc-integrity:
    name: ledger (CHG/ACC + required fields)
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
        with:
          # The lint reconciles commits against the ledger, so it needs full history.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Stdlib-only and ours: no install step, and no skill to read it from.
      - name: Governance gate
        run: python tools/ledger_check.py --repo .
