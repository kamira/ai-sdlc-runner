[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdlc-runner"
version = "0.1.0"
description = "A governed development agent: it walks an ordinary development flow (PM, lead, engineers, review panel, QA) and decides at every step whether to proceed or stop for a person. Its flow and its governance are its own — it depends on no external agent and holds no vendored contract."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ai-sdlc-runner" }]
# Standard library only by design. PyYAML is optional; runner.yaml is parsed by
# a tiny built-in reader when PyYAML is absent, so there are zero hard runtime
# dependencies and nothing to fetch before the governance can be read.
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
test = ["pytest>=7.0"]

[project.scripts]
runner = "ai_sdlc_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The console is a data file inside the package, so an installed runner serves the same page a
# checkout does. Without this it is a file that exists in git and not in the wheel -- which is the
# shape of bug that only ever shows up on somebody else's machine.
[tool.setuptools.package-data]
ai_sdlc_runner = ["console/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
