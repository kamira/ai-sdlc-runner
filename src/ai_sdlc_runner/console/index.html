<meta charset="utf-8">
<title>runner</title>
<!--
  The operator console (CHG-20260823-11 task 11).

  Four things and deliberately nothing else: an instruction box, where the run is, the whole flow,
  and the log. Configuration lives on its own tabs; this screen is what you watch.

  THE TOKEN COMES IN THE URL FRAGMENT. A fragment is never sent to a server and never appears in a
  Referer header, so `runner serve` can print one ready-to-open link without the credential
  travelling anywhere it can be logged. The page moves it into sessionStorage and rewrites the
  address bar immediately, so a screenshot of the browser does not carry it either.

  This file holds NO governance. It draws what the server says and sends back what a person clicked.
  Every verdict, every adjudication, every gate is decided on the other side of the wire — and the
  version number in each answer is what stops two tabs from both being right.
-->
<style>
  :root {
    --ink:#191817; --dim:#57534e; --faint:#8a827a; --line:#e0dbd4; --soft:#efebe6;
    --bg:#fbf9f7; --card:#ffffff; --go:#2f6f4f; --stop:#a03528; --wait:#a3701c; --accent:#3b5a8f;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme=light]) {
      --ink:#eae6e1; --dim:#a9a29a; --faint:#7d766e; --line:#33302c; --soft:#242220;
      --bg:#171614; --card:#1d1b19; --go:#7fb894; --stop:#e0806f; --wait:#d9a441; --accent:#8fadd8;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
  header{display:flex;align-items:baseline;gap:14px;padding:12px 18px;border-bottom:1px solid var(--line)}
  header b{font-size:15px;letter-spacing:.02em}
  header .st{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:99px;background:var(--soft)}
  header .st.suspended{color:var(--wait)} header .st.running{color:var(--accent)}
  header .st.finished{color:var(--go)} header .st.stopped{color:var(--stop)}
  header .grow{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}
  main{display:grid;grid-template-columns:minmax(300px,34vw) 1fr;gap:0;height:calc(100vh - 49px)}
  aside{border-right:1px solid var(--line);overflow:auto;padding:12px}
  section{overflow:auto;padding:16px 18px}
  h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);margin:0 0 8px;font-weight:600}
  /* The flowchart. Four states, and each is a different colour on purpose: where the run IS has
     to be findable at a glance, which is the whole reason this stopped being a list. */
  .chart{min-width:100%}
  .chart .edge{fill:none;stroke:var(--line);stroke-width:1.5}
  .chart .edge.taken{stroke:var(--go);stroke-width:2}
  .chart .edge.back{stroke-dasharray:3 3}
  .chart .elabel{font-family:var(--mono);font-size:8.5px;fill:var(--faint)}
  .chart .box{fill:var(--card);stroke:var(--line);stroke-width:1.5}
  .chart .name{font-family:var(--mono);font-size:9.5px;fill:var(--ink)}
  .chart .who{font-family:var(--mono);font-size:7.5px;fill:var(--faint)}

  /* visited — done, and out of the way */
  .chart .n.done .box{fill:var(--soft);stroke:var(--line)}
  .chart .n.done .name{fill:var(--faint)}

  /* HERE — the one thing this panel exists to answer */
  .chart .n.here .box{fill:var(--wait);stroke:var(--wait);stroke-width:2.5}
  .chart .n.here .name{fill:var(--bg);font-weight:700}
  .chart .n.here .who{fill:var(--bg);opacity:.8}
  .chart .halo{fill:none;stroke:var(--wait);stroke-width:2;opacity:.35}

  /* a terminal, and a gate */
  .chart .n.terminal .box{stroke-dasharray:4 3}
  .chart .gatepin{fill:var(--wait)}
  .chart .n.done .gatepin{fill:var(--faint)}
  textarea{width:100%;font:13px/1.5 inherit;padding:9px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);resize:vertical}
  button{font:inherit;padding:6px 13px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);cursor:pointer}
  button.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .ask{border:1px solid var(--wait);border-radius:8px;padding:12px 14px;margin:0 0 16px;background:var(--card)}
  .ask h3{margin:0 0 6px;font-size:14px;color:var(--wait)}
  .ask p{margin:0 0 10px;color:var(--dim)}
  .ask .row{display:flex;gap:8px;flex-wrap:wrap}
  .voices{font-family:var(--mono);font-size:11.5px;color:var(--dim);margin:0 0 10px}
  .voices .no{color:var(--stop)} .voices .yes{color:var(--go)}
  .carry{border:1px solid var(--line);border-radius:6px;margin:0 0 18px;overflow:hidden;background:var(--card)}
  .carry .ch{display:flex;gap:8px;padding:6px 10px;font-size:11.5px;font-weight:600;background:var(--soft)}
  .carry .ch .n{margin-left:auto;font-family:var(--mono);font-size:10px;font-weight:400;color:var(--faint)}
  .carry .cr{display:grid;grid-template-columns:60px 1fr;gap:9px;padding:5px 10px;border-top:1px solid var(--line);font-size:12.5px}
  .carry .cr .cm{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .carry .cr.no .cm{color:var(--stop)}
  ul.log{list-style:none;margin:0;padding:0}
  ul.log li{display:grid;grid-template-columns:150px 74px 1fr;gap:10px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
  ul.log li .id{font-family:var(--mono);font-size:11.5px}
  ul.log li .who{font-size:10.5px;color:var(--faint);font-family:var(--mono)}
  ul.log li.dispatch{color:var(--dim)} ul.log li.dispatch .id{color:var(--wait)}
  ul.log li.seat{background:color-mix(in srgb,var(--accent) 6%,transparent)}
  ul.log li.seat .who{color:var(--accent)}
  .err{color:var(--stop);font-family:var(--mono);font-size:12px;white-space:pre-wrap}
  .muted{color:var(--faint)}
  .legend{font-size:10.5px;color:var(--faint);line-height:1.9;margin:10px 2px 0}
  .legend b{font-weight:600}
  .mdl{border:1px solid var(--line);border-radius:6px;background:var(--card);margin:0 0 8px;overflow:hidden}
  .mdl .h{display:flex;gap:8px;align-items:baseline;padding:6px 9px;background:var(--soft);font-size:12px}
  .mdl .h .id{font-family:var(--mono);font-size:11.5px;font-weight:600}
  .mdl .h .reach{margin-left:auto;font-family:var(--mono);font-size:9.5px;padding:1px 6px;border-radius:99px;background:var(--card);border:1px solid var(--line)}
  .mdl .h .reach.local{color:var(--go)}
  .mdl .h .reach.internal{color:var(--wait)}
  .mdl .h .reach.external{color:var(--stop)}
  .mdl .u{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:4px 9px;border-top:1px solid var(--line);font-size:11.5px}
  .mdl .u .k{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .mdl .u .v{font-family:var(--mono);font-size:10.5px}
  .mdl .u.none .v{color:var(--faint);font-family:inherit;font-style:italic}
  .mdl .u.unknown .k{color:var(--stop)}
  .legend .sw{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle;margin-right:5px;border:1px solid var(--line)}
  .filebtn{font:inherit;padding:6px 13px;border:1px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer}
  button.no{border-color:var(--stop);color:var(--stop)}
  .gap{display:grid;grid-template-columns:110px 1fr;gap:8px;padding:5px 0;border-top:1px solid var(--line);font-size:12.5px}
  .gap .k{font-family:var(--mono);font-size:10.5px;color:var(--stop)}
  .opt{display:grid;grid-template-columns:22px 1fr;gap:8px;padding:3px 0 3px 10px;font-size:12px;color:var(--dim)}
  .opt .n{font-family:var(--mono);font-size:10px;color:var(--faint)}
  .raised{font-size:12px;color:var(--dim);padding:3px 0 3px 2px}
  .raised b{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink)}
</style>

<header>
  <b>runner</b>
  <span class="st" id="state">—</span>
  <span id="where" class="muted"></span>
  <span class="grow" id="meta"></span>
</header>

<main>
  <aside>
    <h2>the flow</h2>
    <div id="flow"></div>
    <p class="legend" id="legend"></p>
    <h2 style="margin-top:22px">the models, and where they are used</h2>
    <div id="models"></div>
  </aside>
  <section>
    <div id="ask"></div>
    <h2>your instruction</h2>
    <textarea id="instruction" rows="3" placeholder="what should this runner build?"></textarea>
    <div style="margin:8px 0 20px" class="ask .row">
      <button class="p" id="start">start the run</button>
      <button id="more">add to the brief</button>
      <label class="filebtn">attach a file<input type="file" id="file" hidden></label></div>
    <div id="brief"></div>
    <h2>the log</h2>
    <ul class="log" id="log"></ul>
    <p class="err" id="err"></p>
  </section>
</main>

<script>
// --- the token, out of the URL and out of sight ------------------------------------------------
(function () {
  var m = /token=([^&]+)/.exec(location.hash);
  if (m) {
    sessionStorage.setItem("runner-token", decodeURIComponent(m[1]));
    history.replaceState(null, "", location.pathname);
  }
})();
var TOKEN = sessionStorage.getItem("runner-token") || "";

var $ = function (s) { return document.querySelector(s); };
var flow = [], state = null, assign = null;

function api(method, path, body) {
  return fetch(path, {
    method: method,
    headers: { "X-Operator-Token": TOKEN, "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined
  }).then(function (r) {
    return r.json().then(function (j) {
      if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
      return j;
    });
  });
}

// --- drawing ---------------------------------------------------------------------------------
var SVGNS = "http://www.w3.org/2000/svg";
var W = 132, H = 26, GAPX = 20, GAPY = 44, PAD = 14;

function svg(name, attrs, parent) {
  var el = document.createElementNS(SVGNS, name);
  for (var k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}

function layout() {
  // Layers from a breadth-first walk of the REAL edges. Computed rather than hand-placed: a
  // hand-drawn diagram is a second description of the graph, and a second description goes stale —
  // this project already had a mock-up claim 23 nodes while drawing 18.
  var by = {}, depth = {}, order = [];
  flow.forEach(function (n) { by[n.id] = n; });
  var queue = ["intake"];
  depth.intake = 0;
  while (queue.length) {
    var id = queue.shift(), n = by[id];
    if (!n) continue;
    order.push(id);
    var outs = [];
    for (var k in n.branches) outs.push(n.branches[k]);
    if (n.next) outs.push(n.next);
    outs.forEach(function (t) {
      if (by[t] && !(t in depth)) { depth[t] = depth[id] + 1; queue.push(t); }
    });
  }
  var rows = {};
  order.forEach(function (id) {
    var d = depth[id];
    (rows[d] = rows[d] || []).push(id);
  });
  var pos = {}, widest = 0;
  Object.keys(rows).forEach(function (d) {
    widest = Math.max(widest, rows[d].length);
    rows[d].forEach(function (id, i) {
      pos[id] = { x: PAD + i * (W + GAPX), y: PAD + Number(d) * (H + GAPY), row: Number(d) };
    });
  });
  return { by: by, pos: pos,
           w: PAD * 2 + widest * (W + GAPX) - GAPX,
           h: PAD * 2 + (Math.max.apply(null, Object.keys(rows).map(Number)) + 1) * (H + GAPY) };
}

function drawFlow() {
  var here = state && state.at, seen = (state && state.visited) || [];
  var L = layout(), host = $("#flow");
  host.innerHTML = "";
  var root = svg("svg", { "class": "chart", width: L.w, height: L.h,
                          viewBox: "0 0 " + L.w + " " + L.h }, host);

  // edges first, so nodes sit on top of them
  flow.forEach(function (n) {
    var from = L.pos[n.id];
    if (!from) return;
    var outs = [];
    for (var k in n.branches) outs.push([k, n.branches[k]]);
    if (n.next) outs.push([null, n.next]);
    outs.forEach(function (pair) {
      var label = pair[0], to = L.pos[pair[1]];
      if (!to) return;
      var back = to.row <= from.row;
      var x1 = from.x + W / 2, y1 = from.y + H, x2 = to.x + W / 2, y2 = to.y;
      var d;
      if (back) {
        // A loop or a send-back. Drawn round the right-hand side so it reads as going *back*
        // rather than as a stray line crossing the spine.
        var side = L.w - 6;
        d = "M " + (from.x + W) + " " + (from.y + H / 2) +
            " H " + side + " V " + (to.y + H / 2) + " H " + (to.x + W);
        y1 = from.y + H / 2;
      } else {
        d = "M " + x1 + " " + y1 + " C " + x1 + " " + (y1 + GAPY / 2) + ", " +
            x2 + " " + (y2 - GAPY / 2) + ", " + x2 + " " + y2;
      }
      // "taken" means this edge was actually walked — both ends visited, in order.
      var walked = seen.indexOf(n.id) >= 0 && seen.indexOf(pair[1]) >= 0;
      svg("path", { "class": "edge" + (back ? " back" : "") + (walked ? " taken" : ""), d: d },
          root);
      if (label) {
        svg("text", { "class": "elabel", x: back ? L.w - 4 : (x1 + x2) / 2 + 3,
                      y: back ? y1 - 4 : y1 + GAPY / 2,
                      "text-anchor": back ? "end" : "middle" }, root).textContent = label;
      }
    });
  });

  // nodes
  flow.forEach(function (n) {
    var p = L.pos[n.id];
    if (!p) return;
    var cls = "n" + (n.id === here ? " here" : seen.indexOf(n.id) >= 0 ? " done" : "") +
              (n.kind === "terminal" ? " terminal" : "");
    var g = svg("g", { "class": cls }, root);
    var t = svg("title", {}, g);
    t.textContent = n.label + (n.gate ? "  ·  gate: " + n.gate : "") + "  ·  " + n.mode +
                    (n.rejects_to ? "  ·  refusal → " + n.rejects_to : "");
    if (n.id === here) {
      svg("rect", { "class": "halo", x: p.x - 4, y: p.y - 4, width: W + 8, height: H + 8,
                    rx: 8 }, g);
    }
    svg("rect", { "class": "box", x: p.x, y: p.y, width: W, height: H, rx: 5 }, g);
    if (n.gate) svg("circle", { "class": "gatepin", cx: p.x + W - 8, cy: p.y + 7, r: 2.6 }, g);
    svg("text", { "class": "name", x: p.x + 8, y: p.y + 12 }, g).textContent = n.id;
    svg("text", { "class": "who", x: p.x + 8, y: p.y + 21 }, g).textContent =
      (n.role || "runner") + " · " + n.mode;
  });

  // Keep the current node on screen without yanking the view when nothing moved.
  var current = root.querySelector(".n.here");
  if (current && current.scrollIntoView) {
    current.scrollIntoView({ block: "nearest", inline: "nearest" });
  }
  drawLegend();
}

function drawModels() {
  var box = $("#models");
  if (!box || !assign) return;
  box.innerHTML = "";
  var byModel = assign.by_model || {};
  var meta = {};
  (assign.models || []).forEach(function (m) { meta[m.id] = m; });

  Object.keys(byModel).sort().forEach(function (id) {
    var use = byModel[id], m = meta[id];
    var el = document.createElement("div"); el.className = "mdl";

    var h = document.createElement("div"); h.className = "h";
    var name = document.createElement("span"); name.className = "id"; name.textContent = id;
    h.appendChild(name);
    if (m) {
      var vendor = document.createElement("span");
      vendor.className = "muted";
      vendor.textContent = m.vendor + " · " + m.transport;
      h.appendChild(vendor);
      var reach = document.createElement("span");
      reach.className = "reach " + m.reach;
      // The one fact worth never having to infer: does work sent here leave this machine?
      reach.textContent = m.reach;
      reach.title = m.leaves_this_machine
        ? "work orders sent to this model leave this machine"
        : "runs on this machine; nothing leaves it";
      h.appendChild(reach);
    } else {
      var gone = document.createElement("span");
      gone.className = "reach external";
      gone.textContent = "not in the registry";
      h.appendChild(gone);
    }
    el.appendChild(h);

    function row(kind, label, cls) {
      var r = document.createElement("div"); r.className = "u" + (cls ? " " + cls : "");
      var k = document.createElement("div"); k.className = "k"; k.textContent = kind;
      var v = document.createElement("div"); v.className = "v"; v.textContent = label;
      r.appendChild(k); r.appendChild(v); el.appendChild(r);
    }

    if (use.nodes && use.nodes.length) {
      // The mode matters as much as the node: three models on a `pool` is one of them doing the
      // work, and on a `model_panel` it is three voices being adjudicated. Same list, different run.
      use.nodes.forEach(function (n) { row("node", n.node_id + "  (" + n.mode + ")"); });
    }
    if (use.seats && use.seats.length) {
      use.seats.forEach(function (seat) { row("seat", seat); });
    }
    if (!(use.nodes || []).length && !(use.seats || []).length) {
      // Said out loud. "Configured" and "used" look identical in a list, and only one of them does
      // anything — a model nobody dispatches to is a setting somebody believes is in effect.
      row("used", "nowhere — this model is registered and nothing dispatches to it", "none");
    }
    box.appendChild(el);
  });

  if (!Object.keys(byModel).length) {
    var p = document.createElement("p");
    p.className = "muted";
    p.style.fontSize = "11.5px";
    p.textContent = "No models registered. Every node is answered by the default agent command.";
    box.appendChild(p);
  }
}

function drawLegend() {
  $("#legend").innerHTML =
    '<span class="sw" style="background:var(--wait);border-color:var(--wait)"></span>' +
    '<b>where the run is</b><br>' +
    '<span class="sw" style="background:var(--soft)"></span>already visited<br>' +
    '<span class="sw" style="background:var(--card)"></span>not reached yet<br>' +
    '<span class="sw" style="background:var(--go);border-color:var(--go)"></span>' +
    'an edge this run took<br>' +
    '<span class="sw" style="background:var(--wait);border-radius:50%;border-color:var(--wait)">' +
    '</span>the node has a gate';
}

function drawLog() {
  var log = (state && state.log) || [];
  $("#log").innerHTML = "";
  // Where the work went, above the asks. A pool picking at random is only acceptable because the
  // choice is visible afterwards, and "visible" has to mean on the screen somebody is looking at.
  ((state && state.dispatches) || []).forEach(function (d) {
    var li = document.createElement("li");
    li.className = "dispatch";
    li.innerHTML = '<span class="id">dispatch</span><span class="who"></span><span></span>';
    li.lastChild.textContent = d;
    $("#log").appendChild(li);
  });
  log.forEach(function (a) {
    var li = document.createElement("li");
    if (a.seat) li.className = "seat";
    li.innerHTML = '<span class="id"></span><span class="who"></span><span class="what"></span>';
    li.querySelector(".id").textContent = a.node_id;
    li.querySelector(".who").textContent =
      a.seat ? "seat:" + a.seat : (a.model || a.role);
    var n = flow.filter(function (x) { return x.id === a.node_id; })[0];
    li.querySelector(".what").textContent = n ? n.label : "";
    $("#log").appendChild(li);
  });
}

function drawBrief() {
  var box = $("#brief"); box.innerHTML = "";
  var asked = (state && state.instructions) || [];
  var files = (state && state.attachments) || [];
  if (!asked.length && !files.length) return;
  var el = document.createElement("div"); el.className = "carry";
  var h = document.createElement("div"); h.className = "ch";
  h.textContent = "the brief so far";
  var n = document.createElement("span"); n.className = "n";
  n.textContent = asked.length + " instruction(s), " + files.length + " attachment(s)";
  h.appendChild(n); el.appendChild(h);
  asked.forEach(function (text, i) {
    var row = document.createElement("div"); row.className = "cr";
    var a = document.createElement("div"); a.className = "cm"; a.textContent = (i + 1) + ".";
    var b = document.createElement("div"); b.className = "cw"; b.textContent = text;
    row.appendChild(a); row.appendChild(b); el.appendChild(row);
  });
  files.forEach(function (f) {
    var row = document.createElement("div"); row.className = "cr";
    var a = document.createElement("div"); a.className = "cm"; a.textContent = "file";
    var b = document.createElement("div"); b.className = "cw";
    // The filename, because that is what a person recognises. It is data here and nowhere near a
    // path -- the runner only ever handles the content hash.
    b.textContent = f.filename + "  (" + f.media_type + ", " + f.size + " bytes)";
    row.appendChild(a); row.appendChild(b); el.appendChild(row);
  });
  ((state && state.attachments_missing) || []).forEach(function (id) {
    var row = document.createElement("div"); row.className = "cr no";
    var a = document.createElement("div"); a.className = "cm"; a.textContent = "missing";
    var b = document.createElement("div"); b.className = "cw";
    b.textContent = id + " is in the manifest and not in the store";
    row.appendChild(a); row.appendChild(b); el.appendChild(row);
  });
  box.appendChild(el);
}

function drawAsk() {
  var box = $("#ask"); box.innerHTML = "";
  if (!state || state.state !== "suspended" || !state.suspended) return;
  var s = state.suspended;
  var el = document.createElement("div"); el.className = "ask";

  if (s.incomplete) {
    // A third kind of stop, and it is neither a gate nor a tie. Nothing has been planned or built:
    // the seats read the requirement first and said what it does not say. Answering it is the
    // instruction box, not a button — which is why there is no button here.
    el.innerHTML = "<h3>The requirement is not complete</h3><p></p>";
    el.querySelector("p").textContent = state.reason;

    (s.missing || []).forEach(function (aspect) {
      var row = document.createElement("div"); row.className = "gap";
      var k = document.createElement("div"); k.className = "k"; k.textContent = aspect;
      var v = document.createElement("div");
      var opts = (s.options || {})[aspect];
      if (opts && opts.length) {
        // Asked three times and not supplied. The runner stops asking and puts options on the
        // table — it does not pick one, and there are always at least three so the choice is real.
        v.textContent = "asked " + (state.intake_asks || 0) +
                        " times. Options, none of them chosen for you:";
        opts.forEach(function (text, i) {
          var o = document.createElement("div"); o.className = "opt";
          var n = document.createElement("div"); n.className = "n"; n.textContent = (i + 1) + ".";
          var t = document.createElement("div"); t.textContent = text;
          o.appendChild(n); o.appendChild(t); v.appendChild(o);
        });
      } else {
        v.textContent = "not stated";
      }
      row.appendChild(k); row.appendChild(v); el.appendChild(row);
    });

    (s.problems || []).forEach(function (line) {
      var d = document.createElement("div"); d.className = "raised";
      var at = line.indexOf(": ");
      var b = document.createElement("b"); b.textContent = at > 0 ? line.slice(0, at) : "seat";
      d.appendChild(b);
      d.appendChild(document.createTextNode("  " + (at > 0 ? line.slice(at + 2) : line)));
      el.appendChild(d);
    });

    Object.keys(s.safety || {}).forEach(function (seat) {
      (s.safety[seat] || []).forEach(function (line) {
        var d = document.createElement("div"); d.className = "raised";
        d.style.color = "var(--stop)";
        var b = document.createElement("b"); b.textContent = seat + " (unsafe)";
        b.style.color = "var(--stop)";
        d.appendChild(b);
        d.appendChild(document.createTextNode("  " + line));
        el.appendChild(d);
      });
    });

    var how = document.createElement("p");
    how.className = "muted";
    how.style.marginTop = "10px";
    how.textContent = "Answer in the box below and press \u201cadd to the brief\u201d, or attach a "
                    + "file. Every work order from then on carries it.";
    el.appendChild(how);
    box.appendChild(el);
    return;
  }

  if (s.undecided) {
    // A tie and a gate are different questions, so they get different controls. Offering "confirm"
    // here would be offering something that cannot answer what is being asked.
    el.innerHTML = "<h3>Nobody decided</h3><p></p><div class='voices'></div><div class='row'></div>";
    el.querySelector("p").textContent =
      s.reason + " The runner will not pick a side — this one is yours.";
    var v = el.querySelector(".voices");
    Object.keys(s.verdicts || {}).sort().forEach(function (name) {
      var d = document.createElement("div");
      d.className = s.verdicts[name] === "pass" ? "yes" : "no";
      d.textContent = name + ": " + s.verdicts[name];
      v.appendChild(d);
    });
    (s.branches || []).forEach(function (branch) {
      var b = document.createElement("button");
      if (branch === "pass") b.className = "p";
      b.textContent = branch;
      b.onclick = function () {
        act("/run/decide", { node_id: s.node_id, branch: branch });
      };
      el.querySelector(".row").appendChild(b);
    });
  } else {
    el.innerHTML = "<h3>Waiting for you</h3><p></p><div class='row'></div>";
    el.querySelector("p").textContent = state.reason;
    var ok = document.createElement("button");
    ok.className = "p";
    ok.textContent = "approve " + s.gate;
    ok.onclick = function () {
      act("/run/gate", { gate: s.gate, node_id: s.node_id });
    };
    el.querySelector(".row").appendChild(ok);

    // Refuse — but only where the graph has somewhere to send a refusal. Offering the button at
    // `merge`, where rejecting means "do not merge" and no node represents that, would be offering
    // a control the server must then decline. The flow says which gates can be refused; this reads
    // it rather than guessing.
    var here = flow.filter(function (n) { return n.id === s.node_id; })[0];
    if (here && here.rejects_to) {
      var no = document.createElement("button");
      no.className = "no";
      no.textContent = "send back to " + here.rejects_to;
      no.onclick = function () {
        act("/run/reject", { gate: s.gate, node_id: s.node_id,
                             reason: $("#instruction").value.trim() });
      };
      el.querySelector(".row").appendChild(no);
    }
  }
  box.appendChild(el);
}

function act(path, body) {
  $("#err").textContent = "";
  body.version = state.version;   // what stops two tabs from both being right
  api("POST", path, body).then(apply).catch(fail);
}

function apply(s) {
  state = s;
  $("#state").textContent = s.state;
  $("#state").className = "st " + s.state;
  $("#where").textContent = s.at ? "at " + s.at : "";
  $("#meta").textContent = "v" + s.version + " · " + (s.log || []).length + " asks";
  $("#start").disabled = (s.state === "running" || s.state === "suspended");
  $("#more").disabled = (s.state === "running");
  drawBrief();
  $("#err").textContent = s.error || "";
  drawFlow(); drawLog(); drawAsk();
}

function fail(e) { $("#err").textContent = e.message; }

$("#start").disabled = true;    // nothing is clickable until the server has said what is true
$("#more").disabled = true;

$("#start").onclick = function () {
  if (!state) return;           // no snapshot means no version to answer, and answering without
                                // one is exactly what the version exists to prevent
  $("#err").textContent = "";
  api("POST", "/run", { instruction: $("#instruction").value, version: state.version })
    .then(apply).catch(fail);
};

// Adding to the brief while a run is under way is the normal case, not a failure of planning: the
// blueprint gets finished while the work happens. Enabled exactly when the server can accept one —
// at a stop — because editing a brief mid-walk would have two nodes in one run answering different
// questions with nothing saying which was which.
$("#more").onclick = function () {
  if (!state) return;
  var text = $("#instruction").value.trim();
  if (!text) { $("#err").textContent = "an empty instruction says nothing"; return; }
  $("#err").textContent = "";
  api("POST", "/run/instruct", { instruction: text, version: state.version })
    .then(function (next) { $("#instruction").value = ""; apply(next); }).catch(fail);
};

// A spec, a wireframe, the screenshot of the thing that is wrong. It reaches every node's work
// order, so the reviewer reads what the engineer built from.
$("#file").onchange = function () {
  var f = this.files && this.files[0];
  this.value = "";
  if (!f || !state) return;
  var reader = new FileReader();
  reader.onload = function () {
    var url = String(reader.result);
    $("#err").textContent = "";
    api("POST", "/attachments", { filename: f.name, version: state.version,
                                  data: url.slice(url.indexOf(",") + 1) })
      .then(apply).catch(fail);
  };
  reader.readAsDataURL(f);
};

// --- go --------------------------------------------------------------------------------------
api("GET", "/flow")
  .then(function (f) { flow = f.nodes; return api("GET", "/config/nodes"); })
  .then(function (a) { assign = a; drawModels(); return api("GET", "/run"); })
  .then(function (s) {
    apply(s);
    // The snapshot came first, so the stream can only ever move us forward from a known state.
    var es = new EventSource("/run/events?token=" + encodeURIComponent(TOKEN));
    es.onmessage = function (m) { apply(JSON.parse(m.data)); };
  })
  .catch(function (e) {
    // Say which of the two it is. "401" on its own sends people looking for a bug in the server,
    // when the usual cause is a link opened without its fragment.
    $("#state").textContent = TOKEN ? "refused" : "no token";
    $("#state").className = "st stopped";
    $("#err").textContent = (TOKEN ? e.message : "This page was opened without an operator token.") +
      "\n\nOpen the link `runner serve` printed, fragment and all:" +
      "\n    http://" + location.host + "/#token=…";
  });
</script>
